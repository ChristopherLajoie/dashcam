<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camera</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
            background: #f2f2f7;
            min-height: 100vh;
            color: #1c1c1e;
        }

        .container {
            max-width: 780px;
            margin: 0 auto;
            padding: 32px 20px 48px;
        }

        /* ── Status bar ── */
        .status-bar {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-bottom: 28px;
        }

        .pill {
            display: flex;
            align-items: center;
            gap: 7px;
            background: white;
            border: 1px solid rgba(0,0,0,0.07);
            padding: 7px 14px;
            border-radius: 99px;
            font-size: 13px;
            font-weight: 500;
            color: #3a3a3c;
            letter-spacing: -0.01em;
        }

        .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #34c759;
            flex-shrink: 0;
        }

        .dot.off { background: #ff3b30; }

        .dot.recording {
            background: #ff3b30;
            animation: pulse 1.6s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50%       { opacity: 0.45; transform: scale(0.8); }
        }

        /* ── Cards ── */
        .card {
            background: white;
            border-radius: 18px;
            border: 1px solid rgba(0,0,0,0.06);
            margin-bottom: 12px;
            overflow: hidden;
        }

        .card-header { padding: 16px 20px; }

        .card-title {
            font-size: 12px;
            font-weight: 600;
            color: #8e8e93;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        /* ── Video ── */
        .video-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
            background: #111;
        }

        #liveVideo {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
        }

        /* Overlays sit above the video but below native controls */
        .video-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            /* Allow clicks to pass through to native controls at the bottom */
            pointer-events: none;
        }

        /* Re-enable pointer events only on the actual button */
        .overlay-btn {
            pointer-events: all;
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: rgba(0,0,0,0.45);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.18s, transform 0.12s;
            color: white;
        }

        .overlay-btn:hover {
            background: rgba(0,0,0,0.62);
            transform: scale(1.07);
        }

        .overlay-btn:active { transform: scale(0.95); }

        /* Pause overlay only shows on hover */
        .video-wrapper .video-overlay.live-overlay {
            opacity: 0;
            transition: opacity 0.2s;
        }

        .video-wrapper:hover .video-overlay.live-overlay {
            opacity: 1;
        }

        /* Loading overlay has a dim background */
        #loadingOverlay { background: rgba(0,0,0,0.35); }

        /* Spinner */
        .spinner {
            width: 28px;
            height: 28px;
            border: 2.5px solid rgba(255,255,255,0.2);
            border-top-color: rgba(255,255,255,0.85);
            border-radius: 50%;
            animation: spin 0.75s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* Pause icon */
        .pause-icon {
            display: inline-flex;
            gap: 4px;
            align-items: center;
        }

        .pause-icon span {
            display: block;
            width: 4px;
            height: 18px;
            background: white;
            border-radius: 2px;
        }

        /* Play triangle */
        .play-icon {
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 11px 0 11px 20px;
            border-color: transparent transparent transparent white;
            margin-left: 4px;
        }

        /* ── WOL ── */
        .card-body {
            padding: 4px 20px 18px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        #wolBtn {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 8px 18px;
            border-radius: 99px;
            border: 1.5px solid #6e6cff;
            background: transparent;
            color: #6e6cff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            letter-spacing: -0.01em;
            width: fit-content;
            white-space: nowrap;
            transition: background 0.18s, color 0.18s, opacity 0.18s, transform 0.1s;
        }

        #wolBtn:hover { background: #6e6cff; color: white; }
        #wolBtn:active { transform: scale(0.96); }
        #wolBtn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }

        #wolStatusLabel {
            font-size: 13px;
            color: #8e8e93;
        }

        /* ── Recordings ── */
        .recordings-list { padding: 0 8px 8px; }

        .recording-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 11px 12px;
            border-radius: 10px;
            transition: background 0.15s;
        }

        .recording-item:hover { background: #f2f2f7; }

        .recording-info {
            font-size: 14px;
            color: #3a3a3c;
            letter-spacing: -0.01em;
        }

        .recording-actions { display: flex; gap: 6px; }

        .action-btn {
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            background: #f2f2f7;
            color: #1c1c1e;
            transition: background 0.15s, transform 0.1s;
        }

        .action-btn:hover { background: #e5e5ea; }
        .action-btn:active { transform: scale(0.92); }

        /* ── Stats ── */
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; }

        .stat-item { padding: 16px 20px; text-align: center; }

        .stat-item:first-child { border-right: 1px solid rgba(0,0,0,0.05); }

        .stat-value {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.03em;
            color: #1c1c1e;
            margin-bottom: 3px;
        }

        .stat-label {
            font-size: 12px;
            color: #8e8e93;
            font-weight: 500;
        }

        .state-msg {
            text-align: center;
            font-size: 13px;
            color: #8e8e93;
            padding: 24px 20px;
        }

        .state-msg.error { color: #ff3b30; }

        @media (max-width: 600px) {
            .container { padding: 20px 12px 40px; }
            .card { border-radius: 14px; }
        }
    </style>
</head>
<body>
    <div class="container">

        <!-- Status pills -->
        <div class="status-bar">
            <div class="pill">
                <div class="dot" id="connectionDot"></div>
                <span id="connectionText">Connected</span>
            </div>
            <div class="pill">
                <div class="dot" id="recordingDot"></div>
                <span id="recordingText">Recording</span>
            </div>
        </div>

        <!-- Live view card -->
        <div class="card">
            <div class="video-wrapper" id="videoWrapper">

                <!-- The video element — controls enabled for progress bar, fullscreen, etc. -->
                <video id="liveVideo" autoplay muted playsinline controls></video>

                <!-- Idle: centred play button -->
                <div class="video-overlay" id="idleOverlay">
                    <button class="overlay-btn" onclick="startStream()">
                        <div class="play-icon"></div>
                    </button>
                </div>

                <!-- Loading: spinner -->
                <div class="video-overlay" id="loadingOverlay" style="display:none;">
                    <div class="spinner"></div>
                </div>

                <!-- Live: translucent stop button, fades in on hover -->
                <div class="video-overlay live-overlay" id="liveOverlay" style="display:none;">
                    <button class="overlay-btn" onclick="stopStream()">
                        <div style="width:16px;height:16px;background:white;border-radius:2px;"></div>
                    </button>
                </div>

                <!-- Error: play/retry button -->
                <div class="video-overlay" id="errorOverlay" style="display:none; background:rgba(0,0,0,0.5);">
                    <button class="overlay-btn" onclick="startStream()">
                        <div class="play-icon"></div>
                    </button>
                </div>

            </div>
        </div>

        <!-- Gaming PC card -->
        <div class="card">
            <div class="card-header">
                <span class="card-title">Christopher's Desktop</span>
            </div>
            <div class="card-body">
                <button id="wolBtn" onclick="wakePC()">Wake</button>
                <span id="wolStatusLabel"></span>
            </div>
        </div>

        <!-- Recordings card -->
        <div class="card">
            <div class="card-header">
                <span class="card-title">Recordings</span>
            </div>
            <div id="recordingsContainer" class="recordings-list">
                <div class="state-msg">Loading…</div>
            </div>
        </div>

        <!-- Storage card -->
        <div class="card">
            <div class="stats-grid" id="statusGrid">
                <div class="stat-item">
                    <div class="stat-value">—</div>
                    <div class="stat-label">Disk Used</div>
                </div>
                <div class="stat-item" style="border-left:1px solid rgba(0,0,0,0.05)">
                    <div class="stat-value">—</div>
                    <div class="stat-label">Free Space</div>
                </div>
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script>
        let isLoading = false;
        let hlsInstance = null;
        let streamActive = false;
        let startAbortController = null;

        function showOverlay(name) {
            document.getElementById('idleOverlay').style.display    = name === 'idle'    ? 'flex' : 'none';
            document.getElementById('loadingOverlay').style.display = name === 'loading' ? 'flex' : 'none';
            document.getElementById('liveOverlay').style.display    = name === 'live'    ? 'flex' : 'none';
            document.getElementById('errorOverlay').style.display   = name === 'error'   ? 'flex' : 'none';
        }

        function setStreamUI(state) {
            const video = document.getElementById('liveVideo');

            if (state === 'off') {
                streamActive = false;
                // Keep last frame — just show idle overlay on top
                showOverlay('idle');
            } else if (state === 'starting') {
                showOverlay('loading');
            } else if (state === 'on') {
                streamActive = true;
                showOverlay('live');
            } else if (state === 'stopping') {
                // Keep live overlay while the stop request is in-flight
                showOverlay('live');
            } else if (state === 'error') {
                streamActive = false;
                showOverlay('error');
            }
        }

        async function waitForStreamReady(signal, timeoutMs = 20000) {
            const deadline = Date.now() + timeoutMs;
            while (Date.now() < deadline) {
                if (signal.aborted) return false;
                try {
                    const res  = await fetch('/api/stream/status', { signal });
                    const data = await res.json();
                    if (data.ready) return true;
                } catch (e) {
                    if (e.name === 'AbortError') return false;
                }
                await new Promise(r => setTimeout(r, 500));
            }
            return false;
        }

        async function startStream() {
            setStreamUI('starting');

            if (startAbortController) startAbortController.abort();
            startAbortController = new AbortController();
            const { signal } = startAbortController;

            try {
                await fetch('/api/stream/start', { method: 'POST', signal });
            } catch (e) {
                if (e.name !== 'AbortError') setStreamUI('error');
                return;
            }

            const ready = await waitForStreamReady(signal);
            if (!ready) {
                if (!signal.aborted) setStreamUI('error');
                return;
            }

            if (signal.aborted) return;

            const video = document.getElementById('liveVideo');

            if (Hls.isSupported()) {
                if (hlsInstance) hlsInstance.destroy();
                hlsInstance = new Hls({
                    liveSyncDurationCount: 2,
                    liveMaxLatencyDurationCount: 5,
                    maxBufferLength: 4,
                    maxMaxBufferLength: 8,
                    lowLatencyMode: false,
                    startPosition: -1,
                });
                hlsInstance.loadSource('/api/stream/hls/stream.m3u8');
                hlsInstance.attachMedia(video);
                hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
                    video.play();
                    setStreamUI('on');
                });
                hlsInstance.on(Hls.Events.ERROR, (event, data) => {
                    if (data.fatal) {
                        setStreamUI('error');
                        if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }
                    }
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = '/api/stream/hls/stream.m3u8?t=' + Date.now();
                video.play();
                setStreamUI('on');
            } else {
                setStreamUI('error');
            }
        }

        async function stopStream() {
            if (startAbortController) {
                startAbortController.abort();
                startAbortController = null;
            }

            setStreamUI('stopping');

            if (hlsInstance) {
                hlsInstance.destroy();
                hlsInstance = null;
            }

            // Pause but keep src so last frame stays frozen
            const video = document.getElementById('liveVideo');
            video.pause();

            try {
                await fetch('/api/stream/stop', { method: 'POST' });
            } catch (e) { /* best-effort */ }

            setStreamUI('off');
        }

        async function wakePC() {
            const btn   = document.getElementById('wolBtn');
            const label = document.getElementById('wolStatusLabel');

            btn.disabled = true;
            label.style.color = '#8e8e93';
            label.textContent = 'Sending\u2026';

            try {
                const res  = await fetch('/api/wol', { method: 'POST' });
                const data = await res.json();
                if (data.status === 'sent') {
                    label.style.color = '#34c759';
                    label.textContent = '\u2714 Sent';
                } else {
                    label.style.color = '#ff3b30';
                    label.textContent = '\u26a0 ' + data.message;
                }
            } catch (e) {
                label.style.color = '#ff3b30';
                label.textContent = '\u26a0 Failed';
            }

            setTimeout(() => {
                btn.disabled = false;
                label.textContent = '';
            }, 5000);
        }

        async function loadRecordings() {
            if (isLoading) return;
            isLoading = true;
            const container = document.getElementById('recordingsContainer');
            try {
                const response = await fetch('/api/recordings');
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const recordings = await response.json();
                if (!recordings || recordings.length === 0) {
                    container.innerHTML = '<div class="state-msg">No recordings yet</div>';
                    return;
                }
                let html = '';
                for (const recording of recordings) {
                    html += `
                        <div class="recording-item">
                            <span class="recording-info">${recording.display_name}</span>
                            <div class="recording-actions">
                                <a href="/api/play/${recording.filename}" target="_blank" class="action-btn" title="Play">&#9654;</a>
                                <a href="/api/download/${recording.filename}" class="action-btn" title="Download">&#8595;</a>
                            </div>
                        </div>
                    `;
                }
                container.innerHTML = html;
            } catch (error) {
                container.innerHTML = `<div class="state-msg error">Error: ${error.message}</div>`;
            } finally {
                isLoading = false;
            }
        }

        async function updateStatus() {
            try {
                const response = await fetch('/api/status');
                if (!response.ok) throw new Error('Failed');
                const data = await response.json();

                document.getElementById('connectionDot').className = 'dot';
                document.getElementById('connectionText').textContent = 'Connected';

                const recDot  = document.getElementById('recordingDot');
                const recText = document.getElementById('recordingText');
                if (data.recording_status === 'active') {
                    recDot.className = 'dot recording';
                    recText.textContent = 'Recording';
                } else {
                    recDot.className = 'dot off';
                    recText.textContent = 'Not Recording';
                }

                const diskPercent = data.disk_usage ? Math.round(data.disk_usage.percent) + '%' : '—';
                const freeSpace   = data.disk_usage ? Math.round(data.disk_usage.free / (1024*1024*1024)) + ' GB' : '—';
                document.getElementById('statusGrid').innerHTML = `
                    <div class="stat-item">
                        <div class="stat-value">${diskPercent}</div>
                        <div class="stat-label">Disk Used</div>
                    </div>
                    <div class="stat-item" style="border-left:1px solid rgba(0,0,0,0.05)">
                        <div class="stat-value">${freeSpace}</div>
                        <div class="stat-label">Free Space</div>
                    </div>
                `;
            } catch {
                document.getElementById('connectionDot').className = 'dot off';
                document.getElementById('connectionText').textContent = 'Disconnected';
            }
        }

        showOverlay('idle');

        window.addEventListener('load', () => {
            updateStatus();
            loadRecordings();
            setInterval(updateStatus, 30000);
            setInterval(loadRecordings, 300000);
        });
    </script>
</body>
</html>
