<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camera</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
            background: #f2f2f7;
            min-height: 100vh;
            color: #1c1c1e;
        }

        .container {
            max-width: 780px;
            margin: 0 auto;
            padding: 32px 20px 48px;
        }

        /* ── Status bar ── */
        .status-bar {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-bottom: 28px;
            flex-wrap: wrap;
        }

        .pill {
            display: flex;
            align-items: center;
            gap: 7px;
            background: white;
            border: 1px solid rgba(0,0,0,0.07);
            padding: 7px 14px;
            border-radius: 99px;
            font-size: 13px;
            font-weight: 500;
            color: #3a3a3c;
            letter-spacing: -0.01em;
        }

        .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #34c759;
            flex-shrink: 0;
        }

        .dot.off { background: #ff3b30; }

        .dot.recording {
            background: #ff3b30;
            animation: pulse 1.6s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50%       { opacity: 0.45; transform: scale(0.8); }
        }

        /* ── Cards ── */
        .card {
            background: white;
            border-radius: 18px;
            border: 1px solid rgba(0,0,0,0.06);
            margin-bottom: 12px;
            overflow: hidden;
        }

        .card-header {
            padding: 16px 20px 0;
        }

        .card-title {
            font-size: 12px;
            font-weight: 600;
            color: #8e8e93;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        /* ── Video ── */
        .video-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
            background: #111;
        }

        #liveVideo {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
        }

        /* Clock — top center of video, stays in fullscreen */
        .video-clock {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            pointer-events: none;
            z-index: 10;
            text-shadow: 0 1px 4px rgba(0,0,0,0.7);
        }

        .video-clock .clock-time {
            font-size: 20px;
            font-weight: 600;
            letter-spacing: -0.02em;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }

        /* Overlays */
        .video-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        .overlay-btn {
            pointer-events: all;
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: rgba(0,0,0,0.45);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.18s, transform 0.12s;
            color: white;
        }

        .overlay-btn:hover { background: rgba(0,0,0,0.62); transform: scale(1.07); }
        .overlay-btn:active { transform: scale(0.95); }

        .video-wrapper .video-overlay.live-overlay {
            opacity: 0;
            transition: opacity 0.2s;
        }

        .video-wrapper:hover .video-overlay.live-overlay { opacity: 1; }

        #loadingOverlay { background: rgba(0,0,0,0.35); }

        .spinner {
            width: 28px;
            height: 28px;
            border: 2.5px solid rgba(255,255,255,0.2);
            border-top-color: rgba(255,255,255,0.85);
            border-radius: 50%;
            animation: spin 0.75s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .stop-icon {
            width: 16px;
            height: 16px;
            background: white;
            border-radius: 2px;
        }

        .play-icon {
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 11px 0 11px 20px;
            border-color: transparent transparent transparent white;
            margin-left: 4px;
        }

        /* ── Info row — between live card and recordings card ── */
        .info-row {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding: 0 4px;
            margin-top: -6px;
            margin-bottom: 6px;
        }

        .info-toggle-btn {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 5px 12px;
            border: none;
            border-radius: 99px;
            background: white;
            border: 1px solid rgba(0,0,0,0.07);
            color: #8e8e93;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            letter-spacing: -0.01em;
            transition: background 0.15s, color 0.15s, transform 0.1s;
        }

        .info-toggle-btn:hover { background: #e5e5ea; color: #3a3a3c; }
        .info-toggle-btn:active { transform: scale(0.94); }
        .info-toggle-btn.active { background: #1c1c1e; color: white; border-color: #1c1c1e; }

        /* ── Stream info panel (below live card, above recordings) ── */
        .stream-info-panel {
            overflow: hidden;
            max-height: 0;
            opacity: 0;
            transition: max-height 0.25s ease, opacity 0.2s ease, margin 0.25s ease;
            margin-bottom: 0;
        }

        .stream-info-panel.visible {
            max-height: 80px;
            opacity: 1;
            margin-bottom: 12px;
        }

        .stream-info-inner {
            background: white;
            border-radius: 14px;
            border: 1px solid rgba(0,0,0,0.06);
            padding: 10px 16px;
            display: flex;
            gap: 24px;
        }

        .stream-info-item {
            display: flex;
            flex-direction: column;
            gap: 1px;
        }

        .stream-info-label {
            font-size: 10px;
            font-weight: 600;
            color: #8e8e93;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        .stream-info-value {
            font-size: 13px;
            font-weight: 500;
            color: #1c1c1e;
            font-variant-numeric: tabular-nums;
            font-family: "SF Mono", "Fira Mono", monospace;
        }

        /* ── Card body ── */
        .card-body {
            padding: 12px 20px 18px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* ── Generic action button (outline pill) ── */
        .action-pill-btn {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 8px 18px;
            border-radius: 99px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            letter-spacing: -0.01em;
            white-space: nowrap;
            transition: background 0.18s, color 0.18s, opacity 0.18s, transform 0.1s;
        }

        .action-pill-btn:active { transform: scale(0.96); }
        .action-pill-btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }

        #wolBtn {
            border: 1.5px solid #6e6cff;
            background: transparent;
            color: #6e6cff;
        }
        #wolBtn:hover:not(:disabled) { background: #6e6cff; color: white; }

        #recordBtn {
            border: 1.5px solid #ff3b30;
            background: transparent;
            color: #ff3b30;
        }
        #recordBtn:hover:not(:disabled) { background: #ff3b30; color: white; }
        #recordBtn.is-recording {
            border-color: #8e8e93;
            color: #8e8e93;
        }
        #recordBtn.is-recording:hover:not(:disabled) { background: #8e8e93; color: white; }

        .status-label { font-size: 13px; color: #8e8e93; }

        /* ── Divider ── */
        .card-divider {
            height: 1px;
            background: rgba(0,0,0,0.05);
            margin: 0 20px;
        }

        /* ── Disk progress bar ── */
        .disk-section { padding: 14px 20px 18px; }

        .disk-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 8px;
        }

        .disk-label { font-size: 13px; color: #3a3a3c; font-weight: 500; }
        .disk-values { font-size: 12px; color: #8e8e93; }

        .progress-track {
            width: 100%;
            height: 6px;
            background: #f2f2f7;
            border-radius: 99px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            border-radius: 99px;
            background: #34c759;
            transition: width 0.5s ease, background 0.3s;
            width: 0%;
        }

        .progress-fill.warn  { background: #ff9f0a; }
        .progress-fill.crit  { background: #ff3b30; }

        /* ── Network interfaces ── */
        .net-list { padding: 8px 20px 14px; border-top: 1px solid rgba(0,0,0,0.05); }

        .net-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 7px 0;
            border-bottom: 1px solid rgba(0,0,0,0.04);
            font-size: 13px;
        }

        .net-row:last-child { border-bottom: none; }

        .net-iface {
            font-weight: 600;
            color: #3a3a3c;
            font-family: "SF Mono", "Fira Mono", monospace;
            font-size: 12px;
        }

        .net-ip {
            color: #8e8e93;
            font-family: "SF Mono", "Fira Mono", monospace;
            font-size: 12px;
        }

        /* ── Recordings ── */
        .recordings-list { padding: 4px 8px 8px; }

        .recording-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 11px 12px;
            border-radius: 10px;
            transition: background 0.15s;
        }

        .recording-item:hover { background: #f2f2f7; }
        .recording-info { font-size: 14px; color: #3a3a3c; letter-spacing: -0.01em; }
        .recording-actions { display: flex; gap: 6px; }

        .rec-action-btn {
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            background: #f2f2f7;
            color: #1c1c1e;
            transition: background 0.15s, transform 0.1s;
        }

        .rec-action-btn:hover { background: #e5e5ea; }
        .rec-action-btn:active { transform: scale(0.92); }

        .rec-action-btn.delete-btn:hover { background: #ff3b30; color: white; }

        .recording-item.deleting {
            opacity: 0.35;
            pointer-events: none;
            transition: opacity 0.25s;
        }

        .state-msg {
            text-align: center;
            font-size: 13px;
            color: #8e8e93;
            padding: 24px 20px;
        }

        .state-msg.error { color: #ff3b30; }

        /* ── Skeleton ── */
        @keyframes shimmer {
            0%   { background-position: -400px 0; }
            100% { background-position:  400px 0; }
        }

        .skeleton-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 11px 12px;
        }

        .skeleton-bar {
            height: 14px;
            border-radius: 6px;
            background: linear-gradient(90deg, #e5e5ea 25%, #f2f2f7 50%, #e5e5ea 75%);
            background-size: 400px 100%;
            animation: shimmer 1.4s ease-in-out infinite;
        }

        .skeleton-name  { width: 55%; }
        .skeleton-btns  { display: flex; gap: 6px; }
        .skeleton-btn   { width: 32px; height: 32px; border-radius: 8px;
                          background: linear-gradient(90deg, #e5e5ea 25%, #f2f2f7 50%, #e5e5ea 75%);
                          background-size: 400px 100%;
                          animation: shimmer 1.4s ease-in-out infinite; }

        @media (max-width: 600px) {
            .container { padding: 20px 12px 40px; }
            .card { border-radius: 14px; }
        }
    </style>
</head>
<body>
    <div class="container">

        <!-- Status pills -->
        <div class="status-bar">
            <div class="pill">
                <div class="dot" id="connectionDot"></div>
                <span id="connectionText">Connected</span>
            </div>
            <div class="pill">
                <div class="dot" id="recordingDot"></div>
                <span id="recordingText">Recording</span>
            </div>
        </div>

        <!-- Live view card -->
        <div class="card">
            <div class="card-header">
                <span class="card-title">Live</span>
            </div>

            <!-- Video -->
            <div class="video-wrapper" id="videoWrapper">
                <video id="liveVideo" autoplay muted playsinline controls></video>

                <!-- Clock — top center, lives inside video-wrapper so it follows into fullscreen -->
                <div class="video-clock">
                    <div class="clock-time" id="clockTime">--:--:--</div>
                </div>

                <!-- Idle overlay -->
                <div class="video-overlay" id="idleOverlay">
                    <button class="overlay-btn" onclick="startStream()">
                        <div class="play-icon"></div>
                    </button>
                </div>

                <!-- Loading overlay -->
                <div class="video-overlay" id="loadingOverlay" style="display:none;">
                    <div class="spinner"></div>
                </div>

                <!-- Live overlay (hover to reveal stop) -->
                <div class="video-overlay live-overlay" id="liveOverlay" style="display:none;">
                    <button class="overlay-btn" onclick="stopStream()">
                        <div class="stop-icon"></div>
                    </button>
                </div>

                <!-- Error overlay -->
                <div class="video-overlay" id="errorOverlay" style="display:none; background:rgba(0,0,0,0.5);">
                    <button class="overlay-btn" onclick="startStream()">
                        <div class="play-icon"></div>
                    </button>
                </div>
            </div>
        </div>

        <!-- Info toggle button — outside the card, right-aligned -->
        <div class="info-row">
            <button class="info-toggle-btn" id="infoToggleBtn" onclick="toggleStreamInfo()">
                <span>i</span> Stream info
            </button>
        </div>

        <!-- Stream info panel — slides open below the button -->
        <div class="stream-info-panel" id="streamInfoPanel">
            <div class="stream-info-inner">
                <div class="stream-info-item">
                    <span class="stream-info-label">FPS</span>
                    <span class="stream-info-value" id="infoFps">—</span>
                </div>
                <div class="stream-info-item">
                    <span class="stream-info-label">Resolution</span>
                    <span class="stream-info-value" id="infoResolution">—</span>
                </div>
            </div>
        </div>

        <!-- Recording control + recordings list (merged card) -->
        <div class="card" id="recordingsCard">
            <div class="card-header">
                <span class="card-title">Recording</span>
            </div>
            <div class="card-body">
                <button id="recordBtn" class="action-pill-btn" onclick="toggleRecording()">Start</button>
                <span id="recordStatusLabel" class="status-label"></span>
            </div>
            <div class="card-divider"></div>
            <div id="recordingsContainer" class="recordings-list">
                <div id="recordingsSkeleton">
                    <div class="skeleton-row"><div class="skeleton-bar skeleton-name"></div><div class="skeleton-btns"><div class="skeleton-btn"></div><div class="skeleton-btn"></div><div class="skeleton-btn"></div></div></div>
                    <div class="skeleton-row"><div class="skeleton-bar skeleton-name" style="width:45%"></div><div class="skeleton-btns"><div class="skeleton-btn"></div><div class="skeleton-btn"></div><div class="skeleton-btn"></div></div></div>
                    <div class="skeleton-row"><div class="skeleton-bar skeleton-name" style="width:60%"></div><div class="skeleton-btns"><div class="skeleton-btn"></div><div class="skeleton-btn"></div><div class="skeleton-btn"></div></div></div>
                </div>
            </div>
        </div>

        <!-- Christopher's Desktop card -->
        <div class="card">
            <div class="card-header">
                <span class="card-title">Christopher's Desktop</span>
            </div>
            <div class="card-body">
                <button id="wolBtn" class="action-pill-btn" onclick="wakePC()">Wake</button>
                <span id="wolStatusLabel" class="status-label"></span>
            </div>
        </div>

        <!-- System card -->
        <div class="card">
            <div class="card-header" style="padding-bottom: 14px;">
                <span class="card-title">System</span>
            </div>
            <div class="disk-section">
                <div class="disk-header">
                    <span class="disk-label">Storage</span>
                    <span class="disk-values" id="diskValues">— GB used · — GB free</span>
                </div>
                <div class="progress-track">
                    <div class="progress-fill" id="diskBar"></div>
                </div>
            </div>
            <div class="net-list" id="netList">
                <div class="net-row">
                    <span class="net-iface">—</span>
                    <span class="net-ip">Loading…</span>
                </div>
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script>
        let isLoading = false;
        let hlsInstance = null;
        let streamActive = false;
        let startAbortController = null;
        let isRecording = false;
        let recordingsLoaded = false;
        let streamInfoVisible = false;

        /* ── Clock ── */
        function updateClock() {
            const now = new Date();
            const hh  = String(now.getHours()).padStart(2, '0');
            const mm  = String(now.getMinutes()).padStart(2, '0');
            const ss  = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('clockTime').textContent = `${hh}:${mm}:${ss}`;
        }

        setInterval(updateClock, 1000);
        updateClock();

        /* ── Stream info toggle ── */
        function toggleStreamInfo() {
            streamInfoVisible = !streamInfoVisible;
            const panel = document.getElementById('streamInfoPanel');
            const btn   = document.getElementById('infoToggleBtn');
            panel.classList.toggle('visible', streamInfoVisible);
            btn.classList.toggle('active', streamInfoVisible);
            if (streamInfoVisible && streamActive) fetchStreamInfo();
        }

        async function fetchStreamInfo() {
            try {
                const res  = await fetch('/api/stream/info');
                const data = await res.json();
                document.getElementById('infoFps').textContent        = data.fps        || '—';
                document.getElementById('infoResolution').textContent = data.resolution || '—';
            } catch (e) { /* silent */ }
        }

        /* ── Overlays ── */
        function showOverlay(name) {
            document.getElementById('idleOverlay').style.display    = name === 'idle'    ? 'flex' : 'none';
            document.getElementById('loadingOverlay').style.display = name === 'loading' ? 'flex' : 'none';
            document.getElementById('liveOverlay').style.display    = name === 'live'    ? 'flex' : 'none';
            document.getElementById('errorOverlay').style.display   = name === 'error'   ? 'flex' : 'none';
        }

        function setStreamUI(state) {
            if (state === 'off') {
                streamActive = false;
                showOverlay('idle');
                document.getElementById('infoFps').textContent        = '—';
                document.getElementById('infoResolution').textContent = '—';
            } else if (state === 'starting') {
                showOverlay('loading');
            } else if (state === 'on') {
                streamActive = true;
                showOverlay('live');
                if (streamInfoVisible) fetchStreamInfo();
            } else if (state === 'stopping') {
                showOverlay('live');
            } else if (state === 'error') {
                streamActive = false;
                showOverlay('error');
            }
        }

        async function waitForStreamReady(signal, timeoutMs = 20000) {
            const deadline = Date.now() + timeoutMs;
            while (Date.now() < deadline) {
                if (signal.aborted) return false;
                try {
                    const res  = await fetch('/api/stream/status', { signal });
                    const data = await res.json();
                    if (data.ready) return true;
                } catch (e) {
                    if (e.name === 'AbortError') return false;
                }
                await new Promise(r => setTimeout(r, 500));
            }
            return false;
        }

        async function startStream() {
            setStreamUI('starting');

            if (startAbortController) startAbortController.abort();
            startAbortController = new AbortController();
            const { signal } = startAbortController;

            try {
                await fetch('/api/stream/start', { method: 'POST', signal });
            } catch (e) {
                if (e.name !== 'AbortError') setStreamUI('error');
                return;
            }

            const ready = await waitForStreamReady(signal);
            if (!ready) {
                if (!signal.aborted) setStreamUI('error');
                return;
            }

            if (signal.aborted) return;

            const video = document.getElementById('liveVideo');

            if (Hls.isSupported()) {
                if (hlsInstance) hlsInstance.destroy();
                hlsInstance = new Hls({
                    liveSyncDurationCount: 2,
                    liveMaxLatencyDurationCount: 5,
                    maxBufferLength: 4,
                    maxMaxBufferLength: 8,
                    lowLatencyMode: false,
                    startPosition: -1,
                });
                hlsInstance.loadSource('/api/stream/hls/stream.m3u8');
                hlsInstance.attachMedia(video);
                hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
                    video.play();
                    setStreamUI('on');
                });
                hlsInstance.on(Hls.Events.ERROR, (event, data) => {
                    if (data.fatal) {
                        setStreamUI('error');
                        if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }
                    }
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = '/api/stream/hls/stream.m3u8?t=' + Date.now();
                video.play();
                setStreamUI('on');
            } else {
                setStreamUI('error');
            }
        }

        async function stopStream() {
            if (startAbortController) {
                startAbortController.abort();
                startAbortController = null;
            }

            setStreamUI('stopping');

            if (hlsInstance) {
                hlsInstance.destroy();
                hlsInstance = null;
            }

            const video = document.getElementById('liveVideo');
            video.pause();

            try {
                await fetch('/api/stream/stop', { method: 'POST' });
            } catch (e) { /* best-effort */ }

            setStreamUI('off');
        }

        /* ── Recording control ── */
        function setRecordingUI(recording) {
            isRecording = recording;
            const btn   = document.getElementById('recordBtn');
            btn.textContent = recording ? 'Stop' : 'Start';
            btn.classList.toggle('is-recording', recording);
        }

        async function toggleRecording() {
            const btn   = document.getElementById('recordBtn');
            const label = document.getElementById('recordStatusLabel');

            btn.disabled = true;
            label.style.color = '#8e8e93';
            label.textContent = isRecording ? 'Stopping…' : 'Starting…';

            const endpoint = isRecording ? '/api/recording/stop' : '/api/recording/start';

            try {
                const res  = await fetch(endpoint, { method: 'POST' });
                const data = await res.json();

                if (data.status === 'started' || data.status === 'stopped') {
                    setRecordingUI(data.status === 'started');
                    label.style.color = '#34c759';
                    label.textContent = data.status === 'started' ? '\u2714 Started' : '\u2714 Stopped';
                    if (data.status === 'stopped') {
                        setTimeout(loadRecordings, 2000);
                    }
                } else {
                    label.style.color = '#ff3b30';
                    label.textContent = '\u26a0 ' + (data.message || 'Error');
                }
            } catch (e) {
                label.style.color = '#ff3b30';
                label.textContent = '\u26a0 Failed';
            }

            btn.disabled = false;
            setTimeout(() => { label.textContent = ''; }, 4000);
        }

        /* ── WOL ── */
        async function wakePC() {
            const btn   = document.getElementById('wolBtn');
            const label = document.getElementById('wolStatusLabel');

            btn.disabled = true;
            label.style.color = '#8e8e93';
            label.textContent = 'Sending…';

            try {
                const res  = await fetch('/api/wol', { method: 'POST' });
                const data = await res.json();
                if (data.status === 'sent') {
                    label.style.color = '#34c759';
                    label.textContent = '\u2714 Sent';
                } else {
                    label.style.color = '#ff3b30';
                    label.textContent = '\u26a0 ' + data.message;
                }
            } catch (e) {
                label.style.color = '#ff3b30';
                label.textContent = '\u26a0 Failed';
            }

            setTimeout(() => { btn.disabled = false; label.textContent = ''; }, 5000);
        }

        /* ── Delete recording ── */
        async function deleteRecording(filename, rowEl) {
            if (!confirm(`Delete ${filename}?`)) return;
            rowEl.classList.add('deleting');
            try {
                const res = await fetch(`/api/delete/${encodeURIComponent(filename)}`, { method: 'DELETE' });
                const data = await res.json();
                if (data.status === 'deleted') {
                    rowEl.style.transition = 'opacity 0.25s, max-height 0.3s, padding 0.3s';
                    rowEl.style.maxHeight = rowEl.offsetHeight + 'px';
                    requestAnimationFrame(() => {
                        rowEl.style.opacity = '0';
                        rowEl.style.maxHeight = '0';
                        rowEl.style.padding = '0';
                        rowEl.style.overflow = 'hidden';
                    });
                    setTimeout(() => rowEl.remove(), 350);
                } else {
                    rowEl.classList.remove('deleting');
                    alert('Delete failed: ' + (data.message || 'Unknown error'));
                }
            } catch (e) {
                rowEl.classList.remove('deleting');
                alert('Delete failed: ' + e.message);
            }
        }

        /* ── Recordings ── */
        async function loadRecordings() {
            if (isLoading) return;
            isLoading = true;
            const container = document.getElementById('recordingsContainer');
            try {
                const response = await fetch('/api/recordings');
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const recordings = await response.json();
                if (!recordings || recordings.length === 0) {
                    container.innerHTML = '<div class="state-msg">No recordings yet</div>';
                    return;
                }
                let html = '';
                for (const recording of recordings) {
                    html += `
                        <div class="recording-item" data-filename="${recording.filename}">
                            <span class="recording-info">${recording.display_name}</span>
                            <div class="recording-actions">
                                <a href="/api/play/${recording.filename}" target="_blank" class="rec-action-btn" title="Play">&#9654;</a>
                                <a href="/api/download/${recording.filename}" class="rec-action-btn" title="Download">&#8595;</a>
                                <button class="rec-action-btn delete-btn" title="Delete" onclick="deleteRecording('${recording.filename}', this.closest('.recording-item'))">&#128465;</button>
                            </div>
                        </div>`;
                }
                container.innerHTML = html;
                recordingsLoaded = true;
            } catch (error) {
                container.innerHTML = `<div class="state-msg error">Error: ${error.message}</div>`;
            } finally {
                isLoading = false;
            }
        }

        /* ── Status ── */
        async function updateStatus() {
            try {
                const response = await fetch('/api/status');
                if (!response.ok) throw new Error('Failed');
                const data = await response.json();

                document.getElementById('connectionDot').className = 'dot';
                document.getElementById('connectionText').textContent = 'Connected';

                const recDot  = document.getElementById('recordingDot');
                const recText = document.getElementById('recordingText');
                const active  = data.recording_status === 'active';

                if (active) {
                    recDot.className = 'dot recording';
                    recText.textContent = 'Recording';
                } else {
                    recDot.className = 'dot off';
                    recText.textContent = 'Not Recording';
                }

                setRecordingUI(active);

                if (data.disk_usage) {
                    const pct     = Math.round(data.disk_usage.percent);
                    const usedGB  = (data.disk_usage.used  / 1e9).toFixed(1);
                    const freeGB  = (data.disk_usage.free  / 1e9).toFixed(1);
                    const totalGB = (data.disk_usage.total / 1e9).toFixed(1);

                    document.getElementById('diskValues').textContent =
                        `${usedGB} GB used \u00b7 ${freeGB} GB free of ${totalGB} GB`;

                    const bar = document.getElementById('diskBar');
                    bar.style.width = pct + '%';
                    bar.className = 'progress-fill' +
                        (pct >= 90 ? ' crit' : pct >= 75 ? ' warn' : '');
                }

                const netList = document.getElementById('netList');
                if (data.network_interfaces && data.network_interfaces.length > 0) {
                    netList.innerHTML = data.network_interfaces.map(n => `
                        <div class="net-row">
                            <span class="net-iface">${n.interface}</span>
                            <span class="net-ip">${n.ip}</span>
                        </div>`).join('');
                } else {
                    netList.innerHTML = '<div class="net-row"><span class="net-iface">\u2014</span><span class="net-ip">No interfaces</span></div>';
                }

            } catch {
                document.getElementById('connectionDot').className = 'dot off';
                document.getElementById('connectionText').textContent = 'Disconnected';
            }
        }

        /* ── Lazy-load recordings via IntersectionObserver ── */
        function setupRecordingsLazyLoad() {
            const card = document.getElementById('recordingsCard');
            if (!('IntersectionObserver' in window)) {
                loadRecordings();
                return;
            }
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting && !recordingsLoaded) {
                        loadRecordings();
                        if (recordingsLoaded) observer.disconnect();
                    }
                });
            }, { rootMargin: '200px' });
            observer.observe(card);
        }

        showOverlay('idle');

        window.addEventListener('load', () => {
            updateStatus();
            setupRecordingsLazyLoad();
            setInterval(updateStatus, 30000);
            setInterval(() => { if (recordingsLoaded) loadRecordings(); }, 300000);
        });
    </script>
</body>
</html>
