<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camera System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #f5f6fa;
            min-height: 100vh;
            color: #333;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 15px;
        }
        
        .status-bar {
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .status-indicator {
            display: flex;
            align-items: center;
            gap: 10px;
            background: white;
            padding: 12px 18px;
            border-radius: 25px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .status-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #28a745;
        }
        
        .status-dot.disconnected {
            background: #dc3545;
        }
        
        .status-text {
            font-weight: 600;
            font-size: 16px;
        }
        
        .section {
            background: white;
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 15px;
        }

        .section-title {
            font-size: 14px;
            font-weight: 600;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 12px;
        }

        .stream-controls {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        #streamToggleBtn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 9px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, opacity 0.2s;
            background: #28a745;
            color: white;
        }

        #streamToggleBtn:hover {
            opacity: 0.88;
        }

        #streamToggleBtn.active {
            background: #dc3545;
        }

        #streamToggleBtn:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        #streamStatusLabel {
            font-size: 13px;
            color: #888;
        }

        #wolBtn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 9px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, opacity 0.2s;
            background: #6f42c1;
            color: white;
        }

        #wolBtn:hover {
            opacity: 0.88;
        }

        #wolBtn:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        #wolStatusLabel {
            font-size: 13px;
            color: #888;
        }
        
        .video-wrapper {
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
        }
        
        #liveVideo {
            width: 100%;
            height: auto;
            display: none;
            background: #000;
        }

        .stream-placeholder {
            width: 100%;
            aspect-ratio: 16/9;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #111;
            color: #555;
            font-size: 14px;
            border-radius: 8px;
            user-select: none;
        }
        
        .recordings-container {
            max-height: 70vh;
            overflow-y: auto;
        }
        
        .recordings-container h3 {
            margin-bottom: 15px;
            color: #2c3e50;
            border-bottom: 2px solid #3498db;
            padding-bottom: 8px;
        }
        
        .recording-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            border-bottom: 1px solid #eee;
            border-radius: 8px;
            margin-bottom: 8px;
            background: #f9f9f9;
        }
        
        .recording-item:hover {
            background: #f0f0f0;
        }
        
        .recording-info {
            flex: 1;
            font-size: 14px;
            color: #666;
        }
        
        .recording-actions {
            display: flex;
            gap: 8px;
        }
        
        .action-btn {
            width: 36px;
            height: 36px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: bold;
        }
        
        .btn-play {
            background: #28a745;
            color: white;
        }
        
        .btn-download {
            background: #007bff;
            color: white;
        }
        
        .status-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 10px;
        }
        
        .status-item {
            text-align: center;
            padding: 15px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .status-value {
            font-size: 1.5em;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 5px;
        }
        
        .status-label {
            color: #666;
            font-size: 12px;
        }
        
        .loading {
            text-align: center;
            color: #666;
            padding: 20px;
        }
        
        .error {
            text-align: center;
            color: #dc3545;
            padding: 20px;
        }
        
        @media (max-width: 768px) {
            .container { padding: 10px; }
            .status-bar { gap: 8px; }
            .status-indicator { padding: 10px 15px; }
            .status-text { font-size: 14px; }
            .section { padding: 12px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="status-bar">
            <div class="status-indicator">
                <div class="status-dot" id="connectionDot"></div>
                <span class="status-text" id="connectionText">Connected</span>
            </div>
            <div class="status-indicator">
                <div class="status-dot" id="recordingDot"></div>
                <span class="status-text" id="recordingText">Recording</span>
            </div>
        </div>

        <!-- Live Stream Section -->
        <div class="section">
            <div class="section-title">Live View</div>

            <div class="stream-controls">
                <button id="streamToggleBtn" onclick="toggleStream()">&#9654; Start Stream</button>
                <span id="streamStatusLabel">Stream is off</span>
            </div>

            <div class="video-wrapper">
                <div class="stream-placeholder" id="streamPlaceholder">
                    No active stream
                </div>
                <video id="liveVideo" autoplay muted playsinline controls></video>
            </div>
        </div>

        <!-- Wake on LAN Section -->
        <div class="section">
            <div class="section-title">Gaming PC</div>
            <div class="stream-controls">
                <button id="wolBtn" onclick="wakePC()">&#9889; Wake PC</button>
                <span id="wolStatusLabel"></span>
            </div>
        </div>
        
        <div class="section">
            <div id="recordingsContainer" class="recordings-container">
                <div class="loading">Loading recordings...</div>
            </div>
        </div>
        
        <div class="status-grid" id="statusGrid">
            <div class="status-item">
                <div class="status-value">...</div>
                <div class="status-label">Disk Usage</div>
            </div>
            <div class="status-item">
                <div class="status-value">...</div>
                <div class="status-label">Free Space</div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script>
        let isLoading = false;
        let hlsInstance = null;
        let streamActive = false;
        let startAbortController = null;

        function setStreamUI(state) {
            const btn = document.getElementById('streamToggleBtn');
            const label = document.getElementById('streamStatusLabel');
            const video = document.getElementById('liveVideo');
            const placeholder = document.getElementById('streamPlaceholder');

            btn.disabled = (state === 'starting' || state === 'stopping');

            if (state === 'off') {
                streamActive = false;
                btn.innerHTML = '&#9654; Start Stream';
                btn.classList.remove('active');
                label.textContent = 'Stream is off';
                video.style.display = 'none';
                placeholder.style.display = 'flex';
                placeholder.textContent = 'No active stream';
            } else if (state === 'starting') {
                btn.innerHTML = '&#8987; Starting\u2026';
                btn.classList.remove('active');
                label.textContent = 'Connecting\u2026';
                placeholder.style.display = 'flex';
                placeholder.textContent = 'Starting stream\u2026';
                video.style.display = 'none';
            } else if (state === 'on') {
                streamActive = true;
                btn.innerHTML = '&#9646;&#9646; Stop Stream';
                btn.classList.add('active');
                label.textContent = 'Stream is live';
                placeholder.style.display = 'none';
                video.style.display = 'block';
            } else if (state === 'stopping') {
                btn.innerHTML = '&#8987; Stopping\u2026';
                label.textContent = 'Stopping\u2026';
            } else if (state === 'error') {
                streamActive = false;
                btn.innerHTML = '&#9654; Retry Stream';
                btn.classList.remove('active');
                btn.disabled = false;
                label.textContent = 'Stream error';
                video.style.display = 'none';
                placeholder.style.display = 'flex';
                placeholder.textContent = '\u26a0 Stream error \u2014 press Start to retry';
            }
        }

        async function waitForStreamReady(signal, timeoutMs = 20000) {
            const deadline = Date.now() + timeoutMs;
            while (Date.now() < deadline) {
                if (signal.aborted) return false;
                try {
                    const res = await fetch('/api/stream/status', { signal });
                    const data = await res.json();
                    if (data.ready) return true;
                    const count = data.count || 0;
                    const placeholder = document.getElementById('streamPlaceholder');
                    if (placeholder) placeholder.textContent = `Building stream\u2026 (${count} segment${count !== 1 ? 's' : ''})`;
                } catch (e) {
                    if (e.name === 'AbortError') return false;
                }
                await new Promise(r => setTimeout(r, 500));
            }
            return false;
        }

        async function startStream() {
            setStreamUI('starting');

            if (startAbortController) startAbortController.abort();
            startAbortController = new AbortController();
            const { signal } = startAbortController;

            try {
                await fetch('/api/stream/start', { method: 'POST', signal });
            } catch (e) {
                if (e.name !== 'AbortError') setStreamUI('error');
                return;
            }

            const ready = await waitForStreamReady(signal);
            if (!ready) {
                if (!signal.aborted) setStreamUI('error');
                return;
            }

            if (signal.aborted) return;

            const video = document.getElementById('liveVideo');

            if (Hls.isSupported()) {
                if (hlsInstance) hlsInstance.destroy();
                hlsInstance = new Hls({
                    liveSyncDurationCount: 2,
                    liveMaxLatencyDurationCount: 5,
                    maxBufferLength: 4,
                    maxMaxBufferLength: 8,
                    lowLatencyMode: false,
                    startPosition: -1,
                });
                hlsInstance.loadSource('/api/stream/hls/stream.m3u8');
                hlsInstance.attachMedia(video);
                hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
                    video.play();
                    setStreamUI('on');
                });
                hlsInstance.on(Hls.Events.ERROR, (event, data) => {
                    if (data.fatal) {
                        setStreamUI('error');
                        if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }
                    }
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = '/api/stream/hls/stream.m3u8?t=' + Date.now();
                video.play();
                setStreamUI('on');
            } else {
                setStreamUI('error');
                document.getElementById('streamPlaceholder').textContent = '\u26a0 HLS not supported in this browser';
            }
        }

        async function stopStream() {
            if (startAbortController) {
                startAbortController.abort();
                startAbortController = null;
            }

            setStreamUI('stopping');

            if (hlsInstance) {
                hlsInstance.destroy();
                hlsInstance = null;
            }

            const video = document.getElementById('liveVideo');
            video.pause();
            video.removeAttribute('src');
            video.load();

            try {
                await fetch('/api/stream/stop', { method: 'POST' });
            } catch (e) { /* best-effort */ }

            setStreamUI('off');
        }

        function toggleStream() {
            if (streamActive) {
                stopStream();
            } else {
                startStream();
            }
        }

        async function wakePC() {
            const btn = document.getElementById('wolBtn');
            const label = document.getElementById('wolStatusLabel');

            btn.disabled = true;
            label.style.color = '#888';
            label.textContent = 'Sending\u2026';

            try {
                const res = await fetch('/api/wol', { method: 'POST' });
                const data = await res.json();
                if (data.status === 'sent') {
                    label.style.color = '#28a745';
                    label.textContent = '\u2714 Magic packet sent!';
                } else {
                    label.style.color = '#dc3545';
                    label.textContent = '\u26a0 Error: ' + data.message;
                }
            } catch (e) {
                label.style.color = '#dc3545';
                label.textContent = '\u26a0 Request failed';
            }

            setTimeout(() => {
                btn.disabled = false;
                label.textContent = '';
                label.style.color = '#888';
            }, 5000);
        }

        async function loadRecordings() {
            if (isLoading) return;
            isLoading = true;
            const container = document.getElementById('recordingsContainer');
            try {
                const response = await fetch('/api/recordings');
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const recordings = await response.json();
                if (!recordings || recordings.length === 0) {
                    container.innerHTML = '<div class="loading">No recordings found</div>';
                    return;
                }
                let html = '<h3>Recordings</h3>';
                for (const recording of recordings) {
                    html += `
                        <div class="recording-item">
                            <div class="recording-info">${recording.display_name}</div>
                            <div class="recording-actions">
                                <a href="/api/play/${recording.filename}" target="_blank" class="action-btn btn-play">&#9654;</a>
                                <a href="/api/download/${recording.filename}" class="action-btn btn-download">&#8595;</a>
                            </div>
                        </div>
                    `;
                }
                container.innerHTML = html;
            } catch (error) {
                container.innerHTML = `<div class="error">Error: ${error.message}</div>`;
            } finally {
                isLoading = false;
            }
        }

        async function updateStatus() {
            try {
                const response = await fetch('/api/status');
                if (!response.ok) throw new Error('Failed');
                const data = await response.json();

                document.getElementById('connectionDot').className = 'status-dot';
                document.getElementById('connectionText').textContent = 'Connected';

                const recDot = document.getElementById('recordingDot');
                const recText = document.getElementById('recordingText');
                if (data.recording_status === 'active') {
                    recDot.className = 'status-dot';
                    recText.textContent = 'Recording';
                } else {
                    recDot.className = 'status-dot disconnected';
                    recText.textContent = 'Not Recording';
                }

                const diskPercent = data.disk_usage ? Math.round(data.disk_usage.percent) + '%' : 'N/A';
                const freeSpace = data.disk_usage ? Math.round(data.disk_usage.free / (1024*1024*1024)) + ' GB' : 'N/A';
                document.getElementById('statusGrid').innerHTML = `
                    <div class="status-item"><div class="status-value">${diskPercent}</div><div class="status-label">Disk Usage</div></div>
                    <div class="status-item"><div class="status-value">${freeSpace}</div><div class="status-label">Free Space</div></div>
                `;
            } catch {
                ['connectionDot','recordingDot'].forEach(id => document.getElementById(id).className = 'status-dot disconnected');
                document.getElementById('connectionText').textContent = 'Error';
                document.getElementById('recordingText').textContent = 'Error';
            }
        }

        setStreamUI('off');

        window.addEventListener('load', () => {
            updateStatus();
            loadRecordings();
            setInterval(updateStatus, 30000);
            setInterval(loadRecordings, 300000);
        });
    </script>
</body>
</html>
